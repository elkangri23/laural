[package]
name = "laural"
version = "0.1.0-alpha.14"
description = "Terminal de escritorio con IA local y agentes configurables"
authors = ["Laural contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "laural_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "macros", "sync"] }
keyring = { version = "3.6", features = ["windows-native"] }
tauri-plugin-dialog = "2"
tempfile = "3"
tauri-plugin-updater = "2.14.1"
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.23.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
zeroize = { version = "1.9.2", features = ["alloc", "derive"] }
sha2 = "0.11.1"
url = "2.5.9"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
