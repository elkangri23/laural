name: Informe de error
description: Reporta un fallo reproducible de Laural
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No incluyas API keys, datos privados, texto confidencial de terminal ni proyectos de usuario.
  - type: input
    id: version
    attributes:
      label: Versión de Laural
      placeholder: 0.1.0 o commit
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell afectada
      options:
        - PowerShell
        - CMD
        - WSL
        - Git Bash
        - No aplica
        - Otro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Usa una carpeta de prueba y elimina secretos de la descripción.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Revisión de privacidad
      options:
        - label: He quitado API keys, datos privados y contenido sensible de logs o capturas.
          required: true
