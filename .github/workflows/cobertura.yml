name: Pruebas con cobertura
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cobertura:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-audit@0.22.2
      - run: npm ci
      - name: Auditar dependencias JavaScript de escritorio
        run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Auditar dependencias Rust
        # RUSTSEC-2024-0429 llega por GTK3/Linux; Laural se publica primero en Windows y no usa VariantStrIter.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0429 --deny unsound
      - run: npm run test:coverage
      - run: cargo llvm-cov report --summary-only
        working-directory: src-tauri
      - run: cargo llvm-cov report --json --summary-only --output-path target/critical-rust-coverage.json
        working-directory: src-tauri
      - run: node scripts/check-critical-rust-coverage.mjs src-tauri/target/critical-rust-coverage.json
        name: Exigir cobertura de líneas crítica del 85 %
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: informes-cobertura
          path: |
            coverage/
            src-tauri/target/llvm-cov/html/
          if-no-files-found: error
  cobertura-ramas-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Instalar dependencias nativas de Tauri
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes build-essential curl wget file libxdo-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable action revision
        with:
          toolchain: nightly-2026-11-21
          components: llvm-tools-preview
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Medir ramas Rust en nightly
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lib --branch --json --output-path src-tauri/target/critical-rust-branch-coverage.json
      - name: Exigir cobertura de ramas crítica del 65 %
        run: node scripts/check-critical-rust-coverage.mjs src-tauri/target/critical-rust-branch-coverage.json --branches
      - name: Generar informe HTML detallado de ramas
        run: cargo llvm-cov report --manifest-path src-tauri/Cargo.toml --branch --html --output-dir src-tauri/target/llvm-cov-branch-html
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: cobertura-ramas-rust
          path: |
            src-tauri/target/critical-rust-branch-coverage.json
            src-tauri/target/llvm-cov-branch-html/
          if-no-files-found: warn
  cobertura-servicio-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laural_test
          POSTGRES_USER: laural
          POSTGRES_PASSWORD: laural_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laural -d laural_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://laural:laural_test_password@localhost:5432/laural_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Auditar dependencias del servicio
        run: npm audit --audit-level=moderate
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:coverage
        working-directory: server
      - name: Exigir 100 % en lógica y autenticación Críticas del servicio
        run: node scripts/check-critical-coverage.mjs coverage/coverage-final.json
        working-directory: server
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cobertura-servicio-sync
          path: server/coverage/
          if-no-files-found: error
