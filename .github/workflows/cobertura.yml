name: Pruebas con cobertura
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cobertura:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: cargo llvm-cov report --summary-only
        working-directory: src-tauri
      - run: cargo llvm-cov report --json --summary-only --output-path target/critical-rust-coverage.json
        working-directory: src-tauri
      - run: node scripts/check-critical-rust-coverage.mjs src-tauri/target/critical-rust-coverage.json
        name: Exigir cobertura de líneas crítica del 85 %
      - uses: actions/upload-artifact@v6
        with:
          name: informes-cobertura
          path: |
            coverage/
            src-tauri/target/llvm-cov/html/
          if-no-files-found: error
  cobertura-servicio-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: laural_test
          POSTGRES_USER: laural
          POSTGRES_PASSWORD: laural_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laural -d laural_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://laural:laural_test_password@localhost:5432/laural_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm run test:coverage
        working-directory: server
      - uses: actions/upload-artifact@v6
        with:
          name: cobertura-servicio-sync
          path: server/coverage/
          if-no-files-found: error
