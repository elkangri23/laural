name: Publicar actualización para Windows

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  publicar-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v5
        with:
          path: src-tauri/target
          key: windows-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-release-
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Laural ${{ github.ref_name }}
          releaseBody: |
            Actualización de Laural para Windows x64.

            ## Novedades de alpha.18
            - Varios proyectos locales con terminales independientes y planes del agente ligados a su carpeta de origen.
            - Ajustes reorganizados, español/inglés y sugerencias discretas de rutas en PowerShell.
            - Diagnósticos de proveedor más claros, sin mostrar rutas ni claves en errores de conexión.
            - Inicio de sesión OAuth corregido y plantillas de correo unificadas en el servicio.

            Consulta [el registro de cambios](https://github.com/elkangri23/laural/blob/main/CHANGELOG.md) para el detalle. El instalador NSIS incluye el manifiesto firmado para el actualizador integrado. Esta versión sigue siendo una pre-release.
          prerelease: true
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Publicar suma SHA-256 del instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Se esperaba un único instalador NSIS; encontrados: $($installers.Count)." }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash
          $checksumPath = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload $env:GITHUB_REF_NAME $checksumPath --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publicar el manifiesto para el cliente
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace('refs/tags/', '');
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const asset = release.assets.find(({ name }) => name === 'latest.json');
            if (!asset) throw new Error('La publicación no contiene latest.json firmado.');
            const response = await fetch(asset.browser_download_url);
            if (!response.ok) throw new Error(`No se pudo leer latest.json: HTTP ${response.status}`);
            const manifest = await response.text();
            JSON.parse(manifest);
            let sha;
            try {
              const { data: current } = await github.rest.repos.getContent({ owner, repo, path: 'updates/latest.json', ref: 'main' });
              sha = current.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: 'updates/latest.json',
              branch: 'main',
              message: `Publica el manifiesto firmado de ${tag}`,
              content: Buffer.from(manifest).toString('base64'),
              ...(sha ? { sha } : {})
            });
