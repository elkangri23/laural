# Despliegue del sync de Laural en el VPS (ver docs/plans/despliegue-sync-vps.md).
# Decisiones 2026-11-23: Docker Compose, nginx existente en el host,
# PostgreSQL dedicado + copia local nocturna (NO es copia de desastre),
# registro público, email+TOTP al abrir, Google/passkeys después,
# remitente Resend noreply@laurafernandezenfermeria.com, sin recuperación
# administrativa al abrir.
#
# Uso:
#   cd <raíz del repo>
#   cp server/.env.example server/.env   # y rellenarlo, nunca en Git
#   docker-compose -f server/compose.yaml run --rm migrate
#   docker-compose -f server/compose.yaml run --rm web-assets
#   docker-compose -f server/compose.yaml up -d
# El directorio de proyecto de Compose es server/ (directorio del
# primer fichero compose), por eso `build.context: ..` es la raíz
# del repo y `env_file: .env` es server/.env.
# En este VPS se usa `docker-compose` (binario), no `docker compose`
# (el plugin no está instalado).
#
# Puertos del host: la API escucha en 127.0.0.1:18080 (el 8080 de
# loopback ya lo usa retaton/Reverb y el 5432 meridiano-db). La base
# de datos NO se publica en el host: la API llega por el nombre de
# servicio `db` dentro de la red.
#
# TRUST_PROXY: Fastify solo confía en X-Forwarded-For si el peer es
# de confianza (server/src/config.ts). Con nginx en el host y la API
# en red bridge, el peer es la puerta de enlace Docker (172.x): se
# confía en 172.16.0.0/12 para que el rate limit distinga IPs reales.
# Retención de copias: 7 días. Copia nocturna: cron del host
# (04:00, `docker-compose -f <ruta>/server/compose.yaml run --rm backup`).
name: laural-sync

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-laural}
      # ${POSTGRES_PASSWORD} se lee de server/.env (fichero de
      # interpolación de Compose). Es obligatorio: si falta, Compose
      # falla antes de arrancar nada.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en server/.env}
      POSTGRES_DB: ${POSTGRES_DB:-laural}
    # Sin puerto publicado en el host: solo la API llega a la base
    # de datos, por el nombre de servicio `db` dentro de la red.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-laural} -d $${POSTGRES_DB:-laural}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: laural-sync-api:latest
    # server/.env (nunca en Git, ver .gitignore: .env, .env.*).
    # Ahí van DATABASE_URL, peppers, Resend, etc. Ver .env.example.
    env_file:
      - .env
    environment:
      # En red bridge, la API debe escuchar en 0.0.0.0 para recibir
      # el tráfico que Docker reenvía desde el host. El valor por
      # defecto del servicio es 127.0.0.1 (server/src/config.ts);
      # sin esta línea, nginx no llegaría a la API.
      # Ver la nota de trustProxy en la cabecera de este fichero.
      HOST: "0.0.0.0"
      PORT: "8080"
      # En Docker, el host de la base de datos es el servicio `db`,
      # no 127.0.0.1. Esto sobrescribe el DATABASE_URL del .env.
      DATABASE_URL: postgres://${POSTGRES_USER:-laural}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laural}
      # Red Docker de confianza para X-Forwarded-For (ver cabecera).
      TRUST_PROXY: "172.16.0.0/12,127.0.0.1,::1"
    # Solo loopback del host: solo nginx (en el host) debe llegar
    # a la API. Nada de exponer el puerto a toda la red.
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Migraciones (14 en main, 001-014). Se ejecuta una sola vez por
  # despliegue, ANTES de arrancar la API, y tras cada cambio de
  # migraciones. Usa el mismo .env que la API: server/src/migrate.ts
  # lee DATABASE_URL y RATE_LIMIT_PEPPER con readConfig().
  migrate:
    profiles:
      - tools
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: laural-sync-api:latest
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-laural}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-laural}
    command: ["node", "dist/server/src/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  # Copia local nocturna de PostgreSQL. NO es copia de desastre y
  # NO protege ante la pérdida total del VPS (decisión 3).
  # Solo ayuda ante un borrado accidental o una migración mala.
  # Se ejecuta una sola vez con `run --rm backup`; el programado
  # nocturno es un cron del host a las 04:00. Retención: 7 días.
  backup:
    profiles:
      - tools
    image: postgres:17
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en server/.env}
    volumes:
      - laural-backups:/backups
    command:
      - sh
      - -c
      - |
        pg_dump -h db -U ${POSTGRES_USER:-laural} -d ${POSTGRES_DB:-laural} -F c -f /backups/laural-$$(date +%Y%m%d-%H%M%S).dump \
        && find /backups -name 'laural-*.dump' -mtime +7 -delete
    depends_on:
      db:
        condition: service_healthy

  # Copia de los activos estáticos de /status a un directorio del
  # host, para que nginx (en el host) pueda servirlos sin depender
  # del proceso API. Ver nginx-*.conf en este despliegue.
  # nginx NO puede leer dentro del contenedor de la API: por eso
  # hace falta este paso en cada despliegue, ANTES de arrancar nginx
  # con la nueva versión. Se ejecuta una sola vez:
  #   docker compose -f server/compose.yaml run --rm web-assets
  # El directorio /var/lib/laural/status-web debe existir en el host
  # y ser escribible por este servicio (se ejecuta como root solo
  # para esta copia; la API normal corre como usuario `node`).
  web-assets:
    profiles:
      - tools
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: laural-sync-api:latest
    user: "0:0"
    volumes:
      - /var/lib/laural/status-web:/status-web
    command: ["sh", "-c", "cp -r /app/server/dist/server/web/. /status-web/ && ls /status-web"]

volumes:
  pgdata:
  laural-backups:
