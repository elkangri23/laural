openapi: 3.1.0
info:
  title: Laural Preference Sync API
  version: 0.1.0
  description: >-
    API privada inicial para snapshots allowlisted y rutas públicas de estado.
    La autenticación y sincronización aún no están desplegadas ni listas para
    producción; esta especificación no implica que el servicio esté publicado.
    Autenticación y snapshots aplican límites persistentes por IP; el exceso
    responde 429 con Retry-After.
servers:
  - url: https://sync.laurafernandezenfermeria.com
paths:
  /status:
    get:
      summary: Consulta la página pública de estado
      security: []
      responses:
        '200': { description: Página HTML pública de estado, servida desde el mismo VPS, content: { text/html: { schema: { type: string } } } }
  /status.json:
    get:
      summary: Consulta estado general e incidencias públicas
      security: []
      responses:
        '200':
          description: Documento público validado y sin datos de usuarios
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state, summary, updatedAt, notices]
                properties:
                  state: { type: string, enum: [unknown, operational, degraded, maintenance] }
                  summary: { type: string, maxLength: 240 }
                  updatedAt: { type: string, format: date-time }
                  notices:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, title, message, updatedAt]
                      properties:
                        kind: { type: string, enum: [incident, maintenance, notice] }
                        title: { type: string, maxLength: 100 }
                        message: { type: string, maxLength: 600 }
                        updatedAt: { type: string, format: date-time }
        '503': { description: Documento de estado no disponible; estado desconocido genérico }
  /auth/native:
    get:
      summary: Inicia un flujo PKCE y muestra el acceso web de Laural
      security: []
      parameters:
        - in: query
          name: redirect_uri
          required: true
          schema: { type: string, maxLength: 256 }
          description: Se limita a http://127.0.0.1:<puerto>/callback sin query ni fragmentos.
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 43, maxLength: 128 }
        - in: query
          name: code_challenge
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - in: query
          name: code_challenge_method
          required: true
          schema: { const: S256 }
      responses:
        '200':
          description: Página de login web protegida con cookie HttpOnly y token CSRF
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            text/html: { schema: { type: string } }
        '400': { description: Parámetros inválidos o redirect fuera de loopback }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/login:
    post:
      summary: Autentica email/contraseña desde el navegador externo
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email, password]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '303': { description: Login válido; redirige solo al callback loopback con code y state }
        '400': { description: Error genérico de credenciales o solicitud expirada }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/passkey/options:
    post:
      summary: Genera opciones de autenticación passkey para el flujo actual
      description: Requiere la cookie segura del flujo y CSRF. Reto de un solo uso, cuenta discoverable y verificación de usuario requerida.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csrf]
              properties: { csrf: { type: string, minLength: 43, maxLength: 43 } }
      responses:
        '200': { description: Opciones WebAuthn; la RP/origen los fija el servidor }
        '400': { description: Flujo caducado o inválido }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/passkey/verify:
    post:
      summary: Verifica una aserción passkey e inicia el flujo nativo
      description: Si la cuenta tiene TOTP activo, devuelve mfaRequired y el login solo termina al validar el segundo factor.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, response]
              properties: { csrf: { type: string, minLength: 43, maxLength: 43 }, response: { type: object, additionalProperties: true } }
      responses:
        '200': { description: Callback loopback permitido o segundo factor TOTP requerido }
        '400': { description: Flujo caducado o solicitud inválida }
        '401': { description: Aserción inválida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/passkeys/status:
    get:
      summary: Consulta si passkeys están habilitadas
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado booleano
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [enabled], properties: { enabled: { type: boolean } } }
        '401': { description: Sesión no autorizada }
  /v1/auth/passkeys/manage-link:
    post:
      summary: Emite un ticket efímero para administrar passkeys
      description: Exige sesión reciente (menos de diez minutos). El ticket dura dos minutos, se usa una vez y solo va en el fragmento URL.
      security:
        - bearerAuth: []
      responses:
        '201': { description: Enlace seguro de gestión }
        '403': { description: La sesión requiere reautenticación reciente }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/passkeys/manage/redeem:
    post:
      summary: Canjea el ticket efímero por una sesión web corta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties: { ticket: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', writeOnly: true } }
      responses:
        '200': { description: Token CSRF y cookies HttpOnly/Secure de cinco minutos }
        '410': { description: Ticket caducado, consumido o inválido }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/login/mfa:
    post:
      summary: Completa el segundo factor del flujo de login nativo
      description: Acepta un TOTP o código de recuperación de un solo uso; el PIN de correo no es válido.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email, proof]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
                proof: { type: string, pattern: '^(?:[0-9]{6}|[A-Fa-f0-9]{4}(?:-[A-Fa-f0-9]{4}){3})$', writeOnly: true }
      responses:
        '303': { description: Segundo factor válido; redirige al callback loopback de un solo uso }
        '400': { description: Factor inválido, reutilizado o flujo expirado }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/register:
    post:
      summary: Formulario web para registrar una cuenta
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, displayName, email, password]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                displayName: { type: string, maxLength: 80 }
                email: { type: string, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200': { description: Página web con respuesta genérica de registro }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/verification/resend:
    post:
      summary: Formulario web para solicitar otro PIN de verificación
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
      responses:
        '200': { description: Respuesta web genérica sujeta a límites por cuenta }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/native/verification/confirm:
    post:
      summary: Formulario web para confirmar PIN de correo
      description: El PIN no inicia sesión ni retira factores de seguridad.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email, pin]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200': { description: Respuesta genérica; el PIN válido marca el correo verificado sin crear sesión }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/native/exchange:
    post:
      summary: Canjea el código loopback con PKCE y crea una sesión
      description: Esta respuesta solo debe consumirse desde el cliente nativo; el token nunca va a la WebView.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                codeVerifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Token opaco de sesión con expiración de 30 días
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken: { type: string, writeOnly: true }
                  expiresAt: { type: string, format: date-time }
                required: [sessionToken, expiresAt]
        '400': { description: Código inválido, caducado o ya consumido }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/session/revoke:
    post:
      summary: Revoca la sesión bearer del equipo actual
      description: Marca como revocada solo la sesión presentada; las demás sesiones del usuario no cambian.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Sesión revocada }
        '401': { description: Sesión no válida, expirada o ya revocada }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/sessions:
    get:
      summary: Lista sesiones activas de la cuenta autenticada
      description: Devuelve solo ID opaco, fechas de creación/vencimiento y si la sesión corresponde al bearer actual. No devuelve IP, ubicación ni credenciales.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesiones activas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, createdAt, expiresAt, current]
                      properties:
                        id: { type: string, format: uuid }
                        createdAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        current: { type: boolean }
        '401': { description: Sesión no válida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/sessions/{sessionId}:
    delete:
      summary: Revoca una sesión activa distinta de la actual
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Sesión revocada }
        '400': { description: Identificador no válido }
        '401': { description: Sesión actual no válida }
        '404': { description: Sesión inexistente, no activa, propia o de otra cuenta }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/sessions/revoke-others:
    post:
      summary: Revoca todas las sesiones activas salvo la actual
      description: Operación idempotente autenticada. No afecta a la sesión bearer presentada.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Número de sesiones revocadas
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401': { description: Sesión actual no válida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/account:
    delete:
      summary: Borra definitivamente la cuenta y los datos asociados en la nube
      description: Requiere la sesión emitida en los últimos diez minutos y la confirmación literal ELIMINAR. No borra configuración ni credenciales locales del cliente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: ELIMINAR }
      responses:
        '204': { description: Cuenta y datos asociados borrados en cascada }
        '400': { description: Confirmación inválida }
        '401': { description: Sesión no válida }
        '403': { description: Se requiere iniciar sesión de nuevo }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa:
    get:
      summary: Consulta estado TOTP y número de códigos de recuperación activos
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado MFA sin revelar semillas ni códigos
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [totpEnabled, recoveryCodesRemaining, enrollmentPending]
                properties:
                  totpEnabled: { type: boolean }
                  recoveryCodesRemaining: { type: integer, minimum: 0, maximum: 10 }
                  enrollmentPending: { type: boolean }
        '401': { description: Sesión no válida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa/totp/enrollment:
    post:
      summary: Inicia enrolamiento TOTP con autenticación reciente
      description: Devuelve el secreto una vez para presentarlo localmente; expira a los 15 minutos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Secreto y URI otpauth para configurar la app autenticadora
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [secret, provisioningUri]
                properties:
                  secret: { type: string, writeOnly: true }
                  provisioningUri: { type: string, writeOnly: true }
        '409': { description: Sesión no reciente o factor ya activo }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      summary: Cancela enrolamiento TOTP y elimina códigos nuevos pendientes
      security:
        - bearerAuth: []
      responses:
        '204': { description: Enrolamiento cancelado }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa/totp/enrollment/confirm:
    post:
      summary: Verifica el TOTP y genera códigos de recuperación pendientes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200': { description: Códigos mostrados una vez, pendientes de confirmación de guardado }
        '400': { description: Código inválido o enrolamiento expirado }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa/totp/enrollment/complete:
    post:
      summary: Activa TOTP tras confirmar que se guardaron los códigos
      security:
        - bearerAuth: []
      responses:
        '204': { description: TOTP activado y demás sesiones revocadas }
        '409': { description: Sin códigos pendientes o sesión reciente no válida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa/recovery-codes/rotate:
    post:
      summary: Genera códigos de recuperación nuevos pendientes
      description: Los códigos actuales siguen válidos hasta confirmar el guardado en la ruta de finalización.
      security:
        - bearerAuth: []
      responses:
        '200': { description: Códigos nuevos mostrados una sola vez }
        '409': { description: Sesión no reciente o TOTP no activo }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/mfa/totp:
    delete:
      summary: Desactiva TOTP con autenticación reciente
      security:
        - bearerAuth: []
      responses:
        '204': { description: Factor eliminado y demás sesiones revocadas }
        '409': { description: Sesión no reciente o factor no activo }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/register:
    post:
      summary: Crea una cuenta pendiente y solicita la verificación de correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, email, password]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, minLength: 6, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '202': { description: Solicitud aceptada; respuesta genérica para evitar enumeración de cuentas }
        '400': { description: Solicitud inválida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/verification/resend:
    post:
      summary: Solicita el reenvío del PIN de verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
      responses:
        '202': { description: Solicitud aceptada de forma genérica; sujeto a límites por cuenta }
        '400': { description: Solicitud inválida }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/verification/confirm:
    post:
      summary: Verifica el correo con un PIN de seis dígitos
      description: El PIN no inicia sesión ni permite retirar factores de seguridad.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, pin]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '202': { description: Solicitud aceptada de forma genérica; no se emite sesión ni se revela si el PIN fue válido }
        '400': { description: Solicitud mal formada }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password-reset/request:
    post:
      summary: Solicita un PIN para cambiar la contraseña
      description: Responde igual si el email no existe, no está verificado o se envió un PIN. El PIN no inicia sesión ni elimina factores MFA.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
      responses:
        '202': { description: Solicitud procesada sin revelar si la cuenta existe }
        '400': { description: Formato inválido }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/auth/password-reset/confirm:
    post:
      summary: Cambia la contraseña con PIN de un solo uso
      description: Cambia la contraseña y revoca las sesiones activas en una transacción. No crea una sesión ni retira factores MFA; la respuesta es genérica para PIN correcto o incorrecto.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, pin, password]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '202': { description: Solicitud procesada; no distingue PIN incorrecto, vencido o correcto }
        '400': { description: Formato inválido }
        '429': { $ref: '#/components/responses/RateLimited' }
  /health/live:
    get:
      summary: Comprueba que el proceso está activo
      security: []
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                required: [status]
  /health/ready:
    get:
      summary: Comprueba disponibilidad de PostgreSQL
      security: []
      responses:
        '200': { description: Base de datos disponible }
        '503': { description: Dependencia no disponible; sin detalles internos }
  /v1/preferences/current:
    get:
      summary: Lee el snapshot de la cuenta autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot actual; null si aún no se ha guardado ninguno
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    oneOf:
                      - $ref: ../shared/preference-snapshot-v1.schema.json
                      - $ref: ../shared/preference-snapshot-v2.schema.json
                      - type: 'null'
                  revision: { type: integer, minimum: 0 }
                required: [snapshot, revision]
        '401': { description: Sesión inválida, revocada o expirada }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      summary: Guarda el snapshot con revisión e idempotencia
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../shared/preference-snapshot-v1.schema.json
                - $ref: ../shared/preference-snapshot-v2.schema.json
      responses:
        '200': { description: Snapshot guardado; respuesta repetida también es idempotente }
        '400': { description: Cabecera o snapshot inválido }
        '401': { description: Sesión inválida, revocada o expirada }
        '409': { description: Clave de idempotencia reutilizada con otro contenido }
        '412': { description: Revisión obsoleta; requiere resolución del cliente }
        '413': { description: Payload superior a 256 KiB }
        '428': { description: Falta If-Match }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/preferences/history:
    get:
      summary: Lista versiones anteriores de preferencias
      description: Devuelve solo metadatos; las versiones no caducan y pertenecen a la cuenta autenticada.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: before
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        '200':
          description: Página de versiones en orden descendente
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        revision: { type: integer, minimum: 1 }
                        createdAt: { type: string, format: date-time }
                      required: [revision, createdAt]
                      additionalProperties: false
                  nextBefore: { oneOf: [{ type: integer, minimum: 1 }, { type: 'null' }] }
                required: [entries, nextBefore]
                additionalProperties: false
        '401': { description: Sesión inválida, revocada o expirada }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/preferences/history/{revision}:
    delete:
      summary: Elimina una versión histórica de la cuenta
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Versión eliminada }
        '401': { description: Sesión inválida, revocada o expirada }
        '404': { description: Versión inexistente en esta cuenta }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/preferences/history/{revision}/restore:
    post:
      summary: Restaura una versión como nueva revisión actual
      description: No modifica la versión histórica. Exige revisión actual e idempotencia; la versión actual pasa al historial.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: revision
          required: true
          schema: { type: integer, minimum: 1 }
        - in: header
          name: If-Match
          required: true
          schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      responses:
        '200': { description: Snapshot restaurado como una nueva revisión actual }
        '400': { description: Revisión o clave idempotente inválida }
        '401': { description: Sesión inválida, revocada o expirada }
        '404': { description: Versión inexistente en esta cuenta }
        '409': { description: Clave idempotente reutilizada con otro contenido }
        '412': { description: Revisión actual obsoleta }
        '428': { description: Falta If-Match }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  responses:
    RateLimited:
      description: Límite de solicitudes excedido para la IP y ruta
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              error: { const: rate_limited }
            required: [error]
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
