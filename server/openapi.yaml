openapi: 3.1.0
info:
  title: Laural Preference Sync API
  version: 0.1.0
  description: >-
    API privada inicial para snapshots allowlisted y rutas públicas de estado.
    La autenticación y sincronización aún no están desplegadas ni listas para
    producción; esta especificación no implica que el servicio esté publicado.
servers:
  - url: https://sync.laurafernandezenfermeria.com
paths:
  /status:
    get:
      summary: Consulta la página pública de estado
      security: []
      responses:
        '200': { description: Página HTML pública de estado, servida desde el mismo VPS, content: { text/html: { schema: { type: string } } } }
  /status.json:
    get:
      summary: Consulta estado general e incidencias públicas
      security: []
      responses:
        '200':
          description: Documento público validado y sin datos de usuarios
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [state, summary, updatedAt, notices]
                properties:
                  state: { type: string, enum: [unknown, operational, degraded, maintenance] }
                  summary: { type: string, maxLength: 240 }
                  updatedAt: { type: string, format: date-time }
                  notices:
                    type: array
                    maxItems: 8
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, title, message, updatedAt]
                      properties:
                        kind: { type: string, enum: [incident, maintenance, notice] }
                        title: { type: string, maxLength: 100 }
                        message: { type: string, maxLength: 600 }
                        updatedAt: { type: string, format: date-time }
        '503': { description: Documento de estado no disponible; estado desconocido genérico }
  /auth/native:
    get:
      summary: Inicia un flujo PKCE y muestra el acceso web de Laural
      security: []
      parameters:
        - in: query
          name: redirect_uri
          required: true
          schema: { type: string, maxLength: 256 }
          description: Se limita a http://127.0.0.1:<puerto>/callback sin query ni fragmentos.
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 43, maxLength: 128 }
        - in: query
          name: code_challenge
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - in: query
          name: code_challenge_method
          required: true
          schema: { const: S256 }
      responses:
        '200':
          description: Página de login web protegida con cookie HttpOnly y token CSRF
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            text/html: { schema: { type: string } }
        '400': { description: Parámetros inválidos o redirect fuera de loopback }
  /auth/native/login:
    post:
      summary: Autentica email/contraseña desde el navegador externo
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email, password]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '303': { description: Login válido; redirige solo al callback loopback con code y state }
        '400': { description: Error genérico de credenciales o solicitud expirada }
  /auth/native/register:
    post:
      summary: Formulario web para registrar una cuenta
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, displayName, email, password]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                displayName: { type: string, maxLength: 80 }
                email: { type: string, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200': { description: Página web con respuesta genérica de registro }
  /auth/native/verification/resend:
    post:
      summary: Formulario web para solicitar otro PIN de verificación
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
      responses:
        '200': { description: Respuesta web genérica sujeta a límites por cuenta }
  /auth/native/verification/confirm:
    post:
      summary: Formulario web para confirmar PIN de correo
      description: El PIN no inicia sesión ni retira factores de seguridad.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [csrf, email, pin]
              properties:
                csrf: { type: string, minLength: 43, maxLength: 43 }
                email: { type: string, maxLength: 320 }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '200': { description: Respuesta genérica; el PIN válido marca el correo verificado sin crear sesión }
  /v1/auth/native/exchange:
    post:
      summary: Canjea el código loopback con PKCE y crea una sesión
      description: Esta respuesta solo debe consumirse desde el cliente nativo; el token nunca va a la WebView.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, codeVerifier]
              properties:
                code: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                codeVerifier: { type: string, minLength: 43, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Token opaco de sesión con expiración de 30 días
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken: { type: string, writeOnly: true }
                  expiresAt: { type: string, format: date-time }
                required: [sessionToken, expiresAt]
        '400': { description: Código inválido, caducado o ya consumido }
  /v1/auth/register:
    post:
      summary: Crea una cuenta pendiente y solicita la verificación de correo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName, email, password]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
                email: { type: string, minLength: 6, maxLength: 320 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '202': { description: Solicitud aceptada; respuesta genérica para evitar enumeración de cuentas }
        '400': { description: Solicitud inválida }
  /v1/auth/verification/resend:
    post:
      summary: Solicita el reenvío del PIN de verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
      responses:
        '202': { description: Solicitud aceptada de forma genérica; sujeto a límites por cuenta }
        '400': { description: Solicitud inválida }
  /v1/auth/verification/confirm:
    post:
      summary: Verifica el correo con un PIN de seis dígitos
      description: El PIN no inicia sesión ni permite retirar factores de seguridad.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, pin]
              properties:
                email: { type: string, minLength: 6, maxLength: 320 }
                pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
      responses:
        '202': { description: Solicitud aceptada de forma genérica; no se emite sesión ni se revela si el PIN fue válido }
        '400': { description: Solicitud mal formada }
  /health/live:
    get:
      summary: Comprueba que el proceso está activo
      security: []
      responses:
        '200':
          description: Proceso disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
                required: [status]
  /health/ready:
    get:
      summary: Comprueba disponibilidad de PostgreSQL
      security: []
      responses:
        '200': { description: Base de datos disponible }
        '503': { description: Dependencia no disponible; sin detalles internos }
  /v1/preferences/current:
    get:
      summary: Lee el snapshot de la cuenta autenticada
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Snapshot actual; null si aún no se ha guardado ninguno
          headers:
            ETag:
              schema: { type: string, pattern: '^"[0-9]+"$' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot:
                    oneOf:
                      - $ref: ../shared/preference-snapshot-v1.schema.json
                      - type: 'null'
                  revision: { type: integer, minimum: 0 }
                required: [snapshot, revision]
        '401': { description: Sesión inválida, revocada o expirada }
    put:
      summary: Guarda el snapshot con revisión e idempotencia
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: If-Match
          required: true
          schema: { type: string, pattern: '^"(0|[1-9][0-9]*)"$' }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../shared/preference-snapshot-v1.schema.json
      responses:
        '200': { description: Snapshot guardado; respuesta repetida también es idempotente }
        '400': { description: Cabecera o snapshot inválido }
        '401': { description: Sesión inválida, revocada o expirada }
        '409': { description: Clave de idempotencia reutilizada con otro contenido }
        '412': { description: Revisión obsoleta; requiere resolución del cliente }
        '413': { description: Payload superior a 256 KiB }
        '428': { description: Falta If-Match }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
