# BORRADOR — nginx para sync.laurafernandezenfermeria.com — SOLO PARA REVISIÓN, NO DESPLEGAR
#
# Base: main 6f8598ada42123bf57b93064be0728a51c0a9660 (2026-11-24).
# Traducción de server/deploy/Caddyfile a nginx, según la decisión 2
# (docs/plans/despliegue-sync-vps.md): nginx existente en el host,
# no Caddy. El Caddyfile queda como referencia del comportamiento.
#
# Qué traduce este fichero, tal cual lo hace Caddy:
#   /status.json            -> fichero estático en /var/lib/laural/status
#   /status, /status.html,
#   /status.css, /status.js -> ficheros estáticos, fuera del proceso API
#   resto                   -> proxy a Fastify en 127.0.0.1:8080
# /status se sirve como estático aparte para que siga disponible si
# caen la API o PostgreSQL (mientras nginx y el VPS sigan activos).
# Una caída total del VPS también deja inaccesible /status.
#
# Ficheros estáticos en el host (ver compose.yaml, servicio web-assets):
#   /var/lib/laural/status-web/  <- copia de dist/server/web en cada despliegue
#                                   (status.html, status.css, status.js)
#   /var/lib/laural/status/status.json  <- documento público persistente,
#                                   copiado de server/web/status.json
#                                   (ejemplo en estado `unknown`), fuera
#                                   de las releases. No hay endpoint web
#                                   para actualizarlo: solo por SSH
#                                   (server/README.md).
# nginx NO puede leer dentro del contenedor de la API: por eso hace
# falta el paso web-assets antes de cada despliegue.
#
# PENDIENTE DE VALIDAR / AJUSTAR EN REVISIÓN (no resuelto aquí):
# - Rutas de los certificados TLS: se usa la ruta habitual de certbot
#   (/etc/letsencrypt/live/<dominio>/...), AJUSTAR a la ruta real del
#   VPS, como en los otros subdominios. No se ha comprobado en el VPS.
# - Ajustes TLS (protocolos, cifrados): reutilizar los del resto de
#   vhosts del VPS; aquí solo se ponen TLS 1.2/1.3 como punto de partida.
# - client_max_body_size 1m: el snapshot está limitado a 256 KiB en
#   la API; 1m deja margen para cabeceras. A confirmar en revisión.
# - Fastify confía en X-Forwarded-For solo si el peer es 127.0.0.1
#   o ::1 (server/src/app.ts: trustProxy). nginx está en el host y
#   conecta a 127.0.0.1:8080, así que el peer es loopback DESDE EL
#   PUNTO DE VISTA DE NGINX, pero la API está en Docker: ver la nota
#   de trustProxy en compose.yaml. NO abrir el registro público
#   hasta resolverlo.

server {
    listen 80;
    server_name sync.laurafernandezenfermeria.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sync.laurafernandezenfermeria.com;

    # AJUSTAR EN REVISIÓN: ruta real de certbot en el VPS.
    ssl_certificate /etc/letsencrypt/live/sync.laurafernandezenfermeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.laurafernandezenfermeria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # El snapshot está limitado a 256 KiB en la API. A confirmar.
    client_max_body_size 1m;

    # /status.json: documento público persistente, leído de disco.
    # Cabeceras tal cual en Caddyfile: no-store y nosniff.
    location = /status.json {
        root /var/lib/laural/status;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # /status -> /status.html, como el rewrite de Caddyfile.
    location = /status {
        rewrite ^/status$ /status.html last;
    }

    # /status.html, /status.css y /status.js: estático aparte.
    # Cabeceras tal cual en Caddyfile.
    location = /status.html {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    location = /status.css {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    location = /status.js {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    # Resto: proxy a Fastify en 127.0.0.1:8080 (puerto publicado
    # solo en loopback en compose.yaml, servicio `api`).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
