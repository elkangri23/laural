# nginx para sync.laurafernandezenfermeria.com (VPS, nginx existente).
# Traducción de server/deploy/Caddyfile a nginx, según la decisión 2
# (docs/plans/despliegue-sync-vps.md): nginx existente en el host,
# no Caddy. El Caddyfile queda como referencia del comportamiento.
#
#   /                           -> redirige a /status (la API no tiene ruta raíz)
#   /status.json            -> fichero estático en /var/lib/laural/status
#   /status, /status.html,
#   /status.css, /status.js -> ficheros estáticos, fuera del proceso API
#   resto                   -> proxy a Fastify en 127.0.0.1:18080
# /status se sirve como estático aparte para que siga disponible si
# caen la API o PostgreSQL (mientras nginx y el VPS sigan activos).
#
# Ficheros estáticos en el host (ver compose.yaml, servicio web-assets):
#   /var/lib/laural/status-web/  <- copia de dist/server/web en cada despliegue
#                                   (status.html, status.css, status.js)
#   /var/lib/laural/status/status.json  <- documento público persistente,
#                                   copiado de server/web/status.json
#                                   (ejemplo en estado `unknown`), fuera
#                                   de las releases. No hay endpoint web
#                                   para actualizarlo: solo por SSH
#                                   (server/README.md).
# nginx NO puede leer dentro del contenedor de la API: por eso hace
# falta el paso web-assets antes de cada despliegue.
#
# TLS: certificado comodín Sectigo *.laurafernandezenfermeria.com,
# el mismo que usan retaton y meridiano-cero
# (/etc/ssl/sectigo/fullchain.crt, válido hasta 2027-04-30).
#
server {
    listen 80;
    listen [::]:80;
    server_name sync.laurafernandezenfermeria.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sync.laurafernandezenfermeria.com;

    # Certificado comodín Sectigo, como el resto de subdominios.
    ssl_certificate /etc/ssl/sectigo/fullchain.crt;
    ssl_certificate_key /etc/ssl/sectigo/laurafernandezenfermeria.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # El snapshot está limitado a 256 KiB en la API.
    client_max_body_size 1m;

    # /status.json: documento público persistente, leído de disco.
    # Cabeceras tal cual en Caddyfile: no-store y nosniff.
    location = /status.json {
        root /var/lib/laural/status;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
    }

    # /status -> /status.html, como el rewrite de Caddyfile.
    location = /status {
        rewrite ^/status$ /status.html last;
    }

    # /status.html, /status.css y /status.js: estático aparte.
    # Cabeceras tal cual en Caddyfile.
    location = /status.html {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    location = /status.css {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    location = /status.js {
        root /var/lib/laural/status-web;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'";
    }

    # La API no tiene ruta raíz (GET / daba 404): la raíz redirige
    # a /status, la página pública del servicio.
    location = / {
        return 302 https://$host/status;
    }

    # Resto: proxy a Fastify en 127.0.0.1:18080 (puerto publicado
    # solo en loopback en compose.yaml, servicio `api`).
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
